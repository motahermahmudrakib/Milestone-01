        <h3>For table tag I need</h3>
        <ul>
            <li>thead</li>
            <li>tbody</li>
            <li>tfoot</li>
            <li>tr(table row)</li>
            <li>td(table data)</li>
        </ul>
    </section>
    <section>
        <h4>Simple table Formate</h4>
        <table>
            <thead></thead>
            <tbody>
                <tr>
                    <td> </td>
                </tr>
            </tbody>
            <tfoot></tfoot>
        </table>
