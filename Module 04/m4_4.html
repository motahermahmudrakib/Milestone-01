<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Moudle4_4</title>
    <style>
        table{
            border-collapse: collapse;
        }
        td,th{
            border: 1px solid black;
            padding: 10px 20px;
        }
    </style>
</head>
<body>
    <h1>How to make table </h1>
    <section>
        <h3>For table tag I need</h3>
        <ul>
            <li>thead</li>
            <li>tbody</li>
            <li>tfoot</li>
            <li>tr(table row)</li>
            <li>td(table data)</li>
        </ul>
    </section>
    <section>
        <h4>Simple table Formate</h4>
        <table>
            <thead></thead>
            <tbody>
                <tr>
                    <td> </td>
                </tr>
            </tbody>
            <tfoot></tfoot>
        </table>
    </section>
        <section>
        <h4>Simple Table: Info collect </h4>
        <table>
            <caption>Information collect</caption>
            <thead>
                <tr>
                    <th>No</th>
                    <th>Fist Name</th>
                    <th>Last name</th>
                    <th>Age</th>
                </tr>
            </thead>
            <tbody>
                <tr>
                    <td>1</td>
                    <td>Afif</td>
                    <td>Hossain</td>
                    <td>22</td>
                </tr>
                <tr>
                    <td>2</td>
                    <td>Omi</td>
                    <td>gang</td>
                    <td>25</td>
                </tr>
                <tr>
                    <td>3</td>
                    <td>Sakid</td>
                    <td>gong</td>
                    <td>30</td>
                </tr>
            </tbody>
            <tfoot>
                <td colspan="4" style="text-align: center;">Total info: 04</td>
            </tfoot>
        </table>
    </section>
</body>
</html>
