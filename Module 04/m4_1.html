<body>
    <h1>Audio and Videeo Tag</h1>
    <audio controls src="Media/sound.mp3"></audio>
    <video controls src="Media/video.mp4"></video>

    <article>
        <video controls width="550">
        <source src="Media/video.mp4" type="video/webm" />

        <source src="Media/video.mp4" type="video/mp4" />

        Download the
        <a href="Media/video.mp4">WEBM</a>
        or
        <a href="Media/video.mp4">MP4</a>
        video.
        </video>

    </article>
