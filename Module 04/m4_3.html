<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Moudle4_3</title>
</head>
<body>
    <header></header>
    <main>
        <section>
            <h2>Basic Form</h2>
            <form action="">
                <label for="name">Enter Your Name</label>
                <input type="text" name="" id="name">

                <label for="email">Your Email</label>
                <input type="email" name="" id="email">
                <fieldset>
                    <legend>Choise your Favourite Hero</legend>
                    <input type="radio" name="Hero" id="ironman">
                    <label for="ironman">Ironman</label>
                    <input type="radio" name="Hero" id="batman">
                    <label for="batman">Batman</label>
                    <input type="radio" name="Hero" id="superman">
                    <label for="superman">Superman</label>
                </fieldset>
                <fieldset>
                    <legend>Favourite book</legend>
                    <input type="checkbox" name="book" id="atomic">
                    <label for="atomic">Atomic Habits</label>
                    <input type="checkbox" name="book" id="unscripted">
                    <label for="unscripted">Unscripted</label>
                </fieldset>
                <button>Submit</button>
            </form>
            
        </section>
    </main>
    <footer></footer>
</body>
</html>
