<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CSS_Module_2_3</title>
    <style>
        /* id selector */
        #paragraph_01{
            font-size: 50px;
            background-color: aquamarine;
        }

        /* class selector */
        .para2{
            color: whitesmoke;
            background-color: blueviolet;
            width: 70%;
            font-size: 70px;

        }

    
    </style>
</head>
<body>
    <h1>This module about css selector</h1>
    <p id="paragraph_01">This line design with css id selector</p>
    <p class="para2">This line design withh class selector</p>
    <p class="para2">This line design withh class selector</p>
</body>
</html>
